<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" aria-labelledby="title description" role="img" viewBox="0 0 1200 710"><title id="title">PAIR threat model</title><desc id="description">Three mutually trusted nodes form a cluster inside a LAN. An unapproved or removed device on that LAN has a crossed arrow toward the cluster. Intended external sources deliver models, metadata, engines, and updates to Node 2. A crossed arrow from attacker-spoofed models and updates points directly to Node 2. A browser on a trusted node connects to an attacker website, with a crossed arrow marking unauthorized PAIR access through web content. Crossed arrows represent attacks to block, not restrictions on normal browsing or downloads.</desc><defs><marker id="normal-arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#52647a" d="M 0 0 L 10 5 L 0 10 Z"/></marker><marker id="attack-arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#b42332" d="M 0 0 L 10 5 L 0 10 Z"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#182b42}.heading{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.node-label{font-size:22px;font-weight:700}.attack-label{fill:#902332;font-size:18px}.attack,.link{fill:none;stroke-width:3}.link{stroke:#52647a}.attack{stroke:#b42332;marker-end:url(#attack-arrow)}.cross,.cross-under{fill:none;stroke-linecap:round}.cross-under{stroke:#fff;stroke-width:11}.attacker,.cross{stroke:#b42332;stroke-width:5}.attacker{fill:#fff0f0;stroke-width:2.5}</style><rect width="1200" height="710" fill="#fff" rx="12"/><text x="40" y="38" class="heading">PAIR threat model</text><rect width="665" height="610" x="30" y="70" fill="#f5f8fc" stroke="#7c8ca0" stroke-width="2" rx="18"/><text x="55" y="107" class="label" font-weight="700">LAN</text><path d="M 277 235 L 443 235 M 252 285 L 323 375 M 468 285 L 397 375" class="link"/><text x="360" y="302" class="small" text-anchor="middle"><tspan x="360">Paired, mutually</tspan> <tspan x="360" dy="23">trusted nodes</tspan></text><circle cx="215" cy="235" r="62" fill="#e4f0ff" stroke="#2361a8" stroke-width="3"/><circle cx="505" cy="235" r="62" fill="#e4f0ff" stroke="#2361a8" stroke-width="3"/><circle cx="360" cy="425" r="62" fill="#e4f0ff" stroke="#2361a8" stroke-width="3"/><text x="215" y="231" class="node-label" text-anchor="middle">Node 1</text><text x="215" y="256" class="small" text-anchor="middle">Trusted</text><text x="505" y="231" class="node-label" text-anchor="middle">Node 2</text><text x="505" y="256" class="small" text-anchor="middle">Trusted</text><text x="360" y="421" class="node-label" text-anchor="middle">Node 3</text><text x="360" y="446" class="small" text-anchor="middle">Trusted</text><path marker-end="url(#normal-arrow)" d="M 902 235 L 567 235" class="link"/><text x="795" y="167" class="label" text-anchor="middle"><tspan x="795">Download models,</tspan> <tspan x="795" dy="24">metadata, engines,</tspan> <tspan x="795" dy="24">and updates</tspan></text><path fill="#eaf6f3" stroke="#247c6d" stroke-width="2.5" d="M 939 282 C 891 282 887 220 929 209 C 925 163 984 148 1009 178 C 1037 139 1100 151 1111 190 C 1169 178 1200 248 1158 274 C 1147 282 1134 282 1122 282 Z"/><text x="1042" y="234" class="label" font-weight="700" text-anchor="middle">Intended sources</text><text x="1042" y="259" class="small" text-anchor="middle">External services</text><polygon points="60 555 88 500 192 500 220 555 192 610 88 610" class="attacker"/><text x="140" y="538" class="small" text-anchor="middle"><tspan x="140">Unapproved</tspan> <tspan x="140" dy="22">or removed</tspan> <tspan x="140" dy="22">device</tspan></text><path d="M 220 555 L 308 464" class="attack"/><path d="M 252 499 L 274 521 M 274 499 L 252 521" class="cross-under"/><path d="M 252 499 L 274 521 M 274 499 L 252 521" class="cross"/><text x="278" y="590" class="attack-label"><tspan x="278">Unauthorized join</tspan> <tspan x="278" dy="24">or use of old credentials</tspan></text><path d="M 505 297 L 505 434 L 545 434 L 545 460" class="link"/><rect width="150" height="96" x="470" y="460" fill="#e7ecf2" stroke="#52647a" stroke-width="2.5" rx="8"/><rect width="126" height="71" x="482" y="472" fill="#fff" stroke="#a4b0bf" stroke-width="1.5" rx="3"/><path d="M 545 557 L 545 576 M 523 577 L 567 577" class="link"/><text x="545" y="517" class="label" text-anchor="middle">Browser</text><polygon points="920 400 950 345 1140 345 1170 400 1140 455 950 455" class="attacker"/><text x="1045" y="393" class="attack-label" text-anchor="middle"><tspan x="1045">Attacker-spoofed</tspan> <tspan x="1045" dy="25">models, updates, etc.</tspan></text><path d="M 920 400 L 563 258" class="attack"/><path d="M 731 318 L 753 340 M 753 318 L 731 340" class="cross-under"/><path d="M 731 318 L 753 340 M 753 318 L 731 340" class="cross"/><text x="795" y="401" class="attack-label" text-anchor="middle">Impersonate or tamper</text><polygon points="930 555 965 495 1125 495 1160 555 1125 615 965 615" class="attacker"/><text x="1045" y="548" class="attack-label" text-anchor="middle"><tspan x="1045">Attacker</tspan> <tspan x="1045" dy="25">website</tspan></text><path d="M 930 555 L 621 510" class="attack"/><path d="M 764 521 L 786 543 M 786 521 L 764 543" class="cross-under"/><path d="M 764 521 L 786 543 M 786 521 L 764 543" class="cross"/><text x="795" y="582" class="attack-label" text-anchor="middle"><tspan x="795">Unauthorized</tspan> <tspan x="795" dy="24">PAIR access through</tspan> <tspan x="795" dy="24">web content</tspan></text></svg>